<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160a45">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Perfumolandia">
  <meta name="description" content="Perfumolandia: o lugar da sua turma. Chat, grupos, chamadas de voz e vídeo e tela compartilhada em até 4K.">
  <meta property="og:title" content="Perfumolandia | O lugar da sua turma">
  <meta property="og:description" content="Chat, grupos, chamadas de voz e vídeo, tela em 4K, música do Spotify e acesso remoto entre amigos.">
  <meta property="og:image" content="https://yakult7.github.io/perfumolandia/icons/icon-512.png">
  <meta property="og:site_name" content="Perfumolandia">
  <meta property="og:type" content="website">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <title>Perfumolandia | O lugar da sua turma</title>
  <script>
    // aberto como app instalado (tela de início), no app do PC ou no app nativo: vai direto para o aplicativo
    (function () {
      var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      if (standalone || window.perfumolandiaDesktop || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
        var inv = /^#\/convite\/([A-Za-z0-9]{4,12})$/.exec(location.hash); // link de convite aberto no app instalado
        location.replace('./app/index.html' + (inv ? '?convite=' + inv[1] : location.search)); // Capacitor devolve o index raiz para caminhos sem extensão
      }
    })();
  </script>
</head>
<body>
  <div id="site"></div>
  <script type="module" src="./site/site.js"></script>
</body>
</html>

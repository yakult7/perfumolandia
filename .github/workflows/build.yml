# Compila tudo a cada envio para a branch main:
#  - site (link para iPhone/navegador) no GitHub Pages
#  - APK Android assinado
#  - app iOS sem assinatura (.ipa) para instalar com Sideloadly
#  - instalador Windows
# Os arquivos ficam na Release "latest" do repositório.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - run: npx cap sync android
      - name: chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/perfumolandia.p12
            echo "KEYSTORE_FILE=$RUNNER_TEMP/perfumolandia.p12" >> $GITHUB_ENV
          fi
      - name: compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Perfumolandia.apk
          else
            echo "::warning::Sem chave de assinatura nos segredos: gerando APK de teste (debug)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Perfumolandia.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: Perfumolandia.apk }

  ios:
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - run: npx cap sync ios
      - name: compilar app iOS (sem assinatura)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../Perfumolandia.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios-ipa, path: Perfumolandia.ipa }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: desktop/dist }
      - name: instalador Windows
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          cp ../assets/icon-transparent-512.png icon.png
          npx electron-builder --win --x64 --publish never
          ls release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/Perfumolandia-Setup.exe
            desktop/release/Perfumolandia-Setup.exe.blockmap
            desktop/release/latest.yml

  release:
    needs: [android, ios, windows]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versão
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      # cada versão vira uma Release própria (v1.2.0...). O app do PC lê o latest.yml da mais recente e se atualiza sozinho.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Perfumolandia ${{ steps.v.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            Baixe para o seu aparelho:
            - **Windows**: Perfumolandia-Setup.exe (atualiza sozinho)
            - **Android**: Perfumolandia.apk
            - **iPhone**: Perfumolandia.ipa (instale com o Sideloadly) ou use o link do site pelo Safari
          files: |
            out/*.apk
            out/*.ipa
            out/*.exe
            out/*.blockmap
            out/latest.yml
